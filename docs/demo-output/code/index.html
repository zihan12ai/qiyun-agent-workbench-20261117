<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="单文件离线待办清单，支持新增、完成、删除，数据保存在浏览器 localStorage。">
<title>我的行动清单</title>
<style>
  :root {
    --bg: #f4f6fa;
    --panel: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --line: #e6e8ee;
    --accent: #2f6feb;
    --accent-soft: rgba(47, 111, 235, .12);
    --danger: #d64545;
    --done: #9aa2b1;
    --radius: 14px;
    --shadow: 0 12px 32px rgba(15, 23, 42, .09);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d;
      --panel: #1c2029;
      --text: #e8eaee;
      --muted: #98a1b0;
      --line: #2b3038;
      --accent: #6f9bff;
      --accent-soft: rgba(111, 155, 255, .16);
      --danger: #ff7a6b;
      --done: #6b7480;
      --shadow: 0 12px 32px rgba(0, 0, 0, .35);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 16px 56px;
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 620px; margin: 0 auto; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
  }

  header h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: .5px;
  }

  header p {
    margin: 4px 0 20px;
    color: var(--muted);
    font-size: 13px;
  }

  .add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .add-form input {
    flex: 1;
    min-width: 0;
    padding: 11px 13px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  .add-form input::placeholder { color: var(--muted); }

  .add-form input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  button {
    font: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }

  .btn-primary {
    padding: 11px 18px;
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    font-weight: 600;
    white-space: nowrap;
    transition: filter .15s, opacity .15s;
  }

  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { filter: brightness(.95); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }

  .filters { display: flex; gap: 4px; }

  .filter-btn {
    padding: 6px 12px;
    border-radius: 999px;
    color: var(--muted);
    font-size: 13px;
    transition: background .15s, color .15s;
  }

  .filter-btn:hover { background: var(--accent-soft); color: var(--accent); }

  .filter-btn.is-active {
    background: var(--accent);
    color: #fff;
  }

  .stats {
    margin-left: auto;
    color: var(--muted);
    font-size: 12.5px;
  }

  .stats b { color: var(--text); font-weight: 600; }

  .list { list-style: none; margin: 0; padding: 0; }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
    animation: pop .18s ease-out;
  }

  .task:last-child { border-bottom: none; }

  @keyframes pop {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: none; }
  }

  .task__check {
    flex: none;
    width: 22px;
    height: 22px;
    margin-top: 1px;
    border: 2px solid var(--line);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    transition: border-color .15s, background .15s, color .15s;
  }

  .task__check:hover { border-color: var(--accent); }

  .task.is-done .task__check {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .task__body {
    flex: 1;
    min-width: 0;
  }

  .task__text {
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  .task.is-done .task__text {
    color: var(--done);
    text-decoration: line-through;
  }

  .task__meta {
    display: block;
    color: var(--muted);
    font-size: 12px;
    text-decoration: none;
  }

  .task__delete {
    flex: none;
    padding: 4px;
    border-radius: 8px;
    color: var(--muted);
    opacity: .6;
    transition: opacity .15s, color .15s, background .15s;
  }

  .task__delete:hover {
    opacity: 1;
    color: var(--danger);
    background: rgba(214, 69, 69, .12);
  }

  .empty {
    padding: 40px 10px;
    text-align: center;
    color: var(--muted);
  }

  .empty__icon { font-size: 34px; line-height: 1; }
  .empty__title { margin: 10px 0 2px; color: var(--text); font-weight: 600; }
  .empty__hint { font-size: 13px; }

  .footer {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12.5px;
  }

  .link-btn {
    margin-left: auto;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 3px;
    font-size: 12.5px;
  }

  .link-btn:hover { color: var(--danger); }
  .link-btn:disabled { opacity: .4; cursor: not-allowed; text-decoration: none; }
  .link-btn:disabled:hover { color: var(--muted); }

  .notice {
    margin-bottom: 14px;
    padding: 10px 12px;
    border: 1px solid var(--danger);
    border-radius: 10px;
    color: var(--danger);
    font-size: 13px;
  }

  .notice[hidden] { display: none; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--text);
    color: var(--panel);
    border-radius: 10px;
    box-shadow: var(--shadow);
    font-size: 13.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }

  .toast.is-visible {
    opacity: 1;
    transform: translateX(-50%) translateY(-6px);
    pointer-events: auto;
  }

  .toast__undo {
    color: var(--accent);
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .toast__undo[hidden] { display: none; }

  @media (max-width: 480px) {
    .card { padding: 18px; }
    .stats { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <main class="card">
      <header>
        <h1>我的行动清单</h1>
        <p>数据自动保存在本机浏览器中，关掉页面也不会丢失。</p>
      </header>

      <p class="notice" id="storage-notice" hidden>
        当前浏览器不可用本地存储（可能处于隐私模式或限制 file:// 页面），任务只在本次会话内有效。
      </p>

      <form class="add-form" id="add-form" autocomplete="off">
        <input id="task-input" type="text" maxlength="200" placeholder="要做点什么？回车即可添加" aria-label="新建任务内容">
        <button class="btn-primary" type="submit">添加</button>
      </form>

      <div class="toolbar">
        <div class="filters" id="filters" role="group" aria-label="按状态筛选">
          <button class="filter-btn is-active" type="button" data-filter="all">全部</button>
          <button class="filter-btn" type="button" data-filter="active">未完成</button>
          <button class="filter-btn" type="button" data-filter="done">已完成</button>
        </div>
        <div class="stats" id="stats" aria-live="polite"></div>
      </div>

      <ul class="list" id="todo-list"></ul>

      <div class="empty" id="empty-state" hidden>
        <div class="empty__icon">📝</div>
        <p class="empty__title">还没有任务</p>
        <p class="empty__hint" id="empty-hint">在上面的输入框写下第一件事吧</p>
      </div>

      <div class="footer">
        <span>共 <b id="stat-total">0</b> 项 · 未完成 <b id="stat-active">0</b> · 已完成 <b id="stat-done">0</b></span>
        <button class="link-btn" id="clear-done" type="button" disabled>清除已完成</button>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toast-text"></span>
    <button class="toast__undo" id="toast-undo" type="button" hidden>撤销</button>
  </div>

<script>
  'use strict';

  var STORAGE_KEY = 'todo.todolist.v1';
  var MAX_LENGTH = 200;

  var CHECK_SVG = '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M4.5 12.5l4.5 4.5L19.5 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var TRASH_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 7h16M9.5 7V5h5v2M6.5 7l1 12h9l1-12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var tasks = [];
  var currentFilter = 'all';
  var storageAvailable = true;
  var lastDeleted = null;
  var toastTimer = null;

  var el = {};

  function uid() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  function formatTime(ts) {
    var d = new Date(ts);
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function isValidTask(t) {
    return t && typeof t.id === 'string' && typeof t.text === 'string';
  }

  function loadTasks() {
    var raw = null;
    try {
      raw = window.localStorage.getItem(STORAGE_KEY);
    } catch (err) {
      storageAvailable = false;
      return [];
    }
    if (!raw) return [];

    var parsed = null;
    try {
      parsed = JSON.parse(raw);
    } catch (err) {
      return [];
    }
    if (!Array.isArray(parsed)) return [];

    return parsed.filter(isValidTask).map(function (t) {
      return {
        id: t.id,
        text: t.text.slice(0, MAX_LENGTH),
        done: !!t.done,
        createdAt: typeof t.createdAt === 'number' ? t.createdAt : Date.now()
      };
    });
  }

  function saveTasks() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
    }
    updateStorageNotice();
  }

  function filterTasks(list, filter) {
    if (filter === 'active') {
      return list.filter(function (t) { return !t.done; });
    }
    if (filter === 'done') {
      return list.filter(function (t) { return t.done; });
    }
    return list.slice();
  }

  function updateStorageNotice() {
    if (!el.notice) return;
    el.notice.hidden = storageAvailable;
  }

  function createTaskNode(task) {
    var li = document.createElement('li');
    li.className = 'task' + (task.done ? ' is-done' : '');
    li.dataset.id = task.id;

    var check = document.createElement('button');
    check.type = 'button';
    check.className = 'task__check';
    check.dataset.action = 'toggle';
    check.setAttribute('role', 'checkbox');
    check.setAttribute('aria-checked', task.done ? 'true' : 'false');
    check.setAttribute('aria-label', task.done ? '标记为未完成' : '标记为已完成');
    check.innerHTML = CHECK_SVG;

    var text = document.createElement('span');
    text.className = 'task__text';
    text.textContent = task.text;

    var meta = document.createElement('span');
    meta.className = 'task__meta';
    meta.textContent = '创建于 ' + formatTime(task.createdAt);

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'task__delete';
    del.dataset.action = 'delete';
    del.setAttribute('aria-label', '删除任务：' + task.text);
    del.innerHTML = TRASH_SVG;

    var body = document.createElement('span');
    body.className = 'task__body';
    body.appendChild(text);
    body.appendChild(meta);

    li.appendChild(check);
    li.appendChild(body);
    li.appendChild(del);
    return li;
  }

  function updateStats() {
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.done; }).length;
    var active = total - done;

    if (el.statTotal) el.statTotal.textContent = String(total);
    if (el.statActive) el.statActive.textContent = String(active);
    if (el.statDone) el.statDone.textContent = String(done);
    if (el.stats) {
      el.stats.textContent = '未完成 ' + active + ' 项 · 已完成 ' + done + ' 项';
    }
    if (el.clearDone) el.clearDone.disabled = done === 0;
  }

  function updateFilterButtons() {
    var buttons = el.filters ? el.filters.querySelectorAll('.filter-btn') : [];
    for (var i = 0; i < buttons.length; i++) {
      var btn = buttons[i];
      if (btn.dataset.filter === currentFilter) {
        btn.classList.add('is-active');
      } else {
        btn.classList.remove('is-active');
      }
    }
  }

  function captureFocus() {
    var active = document.activeElement;
    if (!active || !active.closest) return null;
    var actionEl = active.closest('[data-action]');
    if (!actionEl) return null;
    var li = actionEl.closest('li[data-id]');
    if (!li) return null;
    return { id: li.dataset.id, action: actionEl.dataset.action };
  }

  function findTaskNode(id) {
    if (!el.list) return null;
    var nodes = el.list.childNodes || [];
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].dataset && nodes[i].dataset.id === id) return nodes[i];
    }
    return null;
  }

  function findActionNode(taskNode, action) {
    if (!taskNode) return null;
    var buttons = taskNode.querySelectorAll('[data-action]');
    for (var i = 0; i < buttons.length; i++) {
      if (buttons[i].dataset.action === action) return buttons[i];
    }
    return null;
  }

  function restoreFocus(info) {
    if (!info) return;
    var target = findActionNode(findTaskNode(info.id), info.action);
    if (target && target.focus) target.focus();
  }

  function render() {
    var visible = filterTasks(tasks, currentFilter);
    var focus = captureFocus();

    if (el.list) {
      el.list.innerHTML = '';
      for (var i = 0; i < visible.length; i++) {
        el.list.appendChild(createTaskNode(visible[i]));
      }
    }

    if (el.emptyState) el.emptyState.hidden = visible.length !== 0;
    if (el.list) el.list.hidden = visible.length === 0;
    if (el.emptyHint) {
      if (currentFilter === 'done') {
        el.emptyHint.textContent = '还没有已完成的任务';
      } else if (currentFilter === 'active') {
        el.emptyHint.textContent = '所有任务都已完成，做得好！';
      } else {
        el.emptyHint.textContent = '在上面的输入框写下第一件事吧';
      }
    }

    updateStats();
    updateFilterButtons();
    restoreFocus(focus);
  }

  function addTask(rawText) {
    var text = String(rawText == null ? '' : rawText).replace(/\s+/g, ' ').trim();
    if (!text) return false;
    if (text.length > MAX_LENGTH) text = text.slice(0, MAX_LENGTH);

    tasks.unshift({
      id: uid(),
      text: text,
      done: false,
      createdAt: Date.now()
    });

    saveTasks();
    render();
    return true;
  }

  function toggleTask(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].done = !tasks[i].done;
        saveTasks();
        render();
        return true;
      }
    }
    return false;
  }

  function deleteTask(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        lastDeleted = { task: tasks[i], index: i };
        tasks.splice(i, 1);
        saveTasks();
        render();
        showToast('已删除任务', true);
        return true;
      }
    }
    return false;
  }

  function clearCompleted() {
    var removed = tasks.filter(function (t) { return t.done; }).length;
    if (removed === 0) return 0;
    tasks = tasks.filter(function (t) { return !t.done; });
    saveTasks();
    render();
    showToast('已清除 ' + removed + ' 项已完成任务', false);
    return removed;
  }

  function undoDelete() {
    if (!lastDeleted) return false;
    tasks.splice(Math.min(lastDeleted.index, tasks.length), 0, lastDeleted.task);
    lastDeleted = null;
    saveTasks();
    render();
    hideToast();
    return true;
  }

  function showToast(message, withUndo) {
    if (!el.toast) return;
    el.toastText.textContent = message;
    el.toastUndo.hidden = !withUndo;
    el.toast.classList.add('is-visible');
    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(hideToast, 5000);
  }

  function hideToast() {
    if (!el.toast) return;
    el.toast.classList.remove('is-visible');
    if (toastTimer) {
      window.clearTimeout(toastTimer);
      toastTimer = null;
    }
  }

  function init() {
    el.input = document.getElementById('task-input');
    el.form = document.getElementById('add-form');
    el.list = document.getElementById('todo-list');
    el.filters = document.getElementById('filters');
    el.emptyState = document.getElementById('empty-state');
    el.emptyHint = document.getElementById('empty-hint');
    el.statTotal = document.getElementById('stat-total');
    el.statActive = document.getElementById('stat-active');
    el.statDone = document.getElementById('stat-done');
    el.stats = document.getElementById('stats');
    el.clearDone = document.getElementById('clear-done');
    el.notice = document.getElementById('storage-notice');
    el.toast = document.getElementById('toast');
    el.toastText = document.getElementById('toast-text');
    el.toastUndo = document.getElementById('toast-undo');

    tasks = loadTasks();
    updateStorageNotice();
    render();

    if (el.form) {
      el.form.addEventListener('submit', function (event) {
        event.preventDefault();
        if (!el.input) return;
        if (addTask(el.input.value)) {
          el.input.value = '';
          el.input.focus();
        }
      });
    }

    if (el.input) {
      el.input.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          el.input.value = '';
        }
      });
    }

    if (el.filters) {
      el.filters.addEventListener('click', function (event) {
        var target = event.target.closest ? event.target.closest('.filter-btn') : null;
        if (!target) return;
        currentFilter = target.dataset.filter || 'all';
        render();
      });
    }

    if (el.list) {
      el.list.addEventListener('click', function (event) {
        var actionEl = event.target.closest ? event.target.closest('[data-action]') : null;
        if (!actionEl) return;
        var li = actionEl.closest ? actionEl.closest('li[data-id]') : null;
        if (!li) return;
        var id = li.dataset.id;
        if (actionEl.dataset.action === 'toggle') {
          toggleTask(id);
        } else if (actionEl.dataset.action === 'delete') {
          deleteTask(id);
        }
      });
    }

    if (el.clearDone) {
      el.clearDone.addEventListener('click', function () {
        clearCompleted();
      });
    }

    if (el.toastUndo) {
      el.toastUndo.addEventListener('click', function () {
        undoDelete();
      });
    }

    window.addEventListener('storage', function (event) {
      if (event.key && event.key !== STORAGE_KEY) return;
      tasks = loadTasks();
      render();
    });
  }

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  }
</script>
</body>
</html>
